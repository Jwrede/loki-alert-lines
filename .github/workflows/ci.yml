name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: catches changes in the :latest images
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - loki: grafana/loki:3.7.9
            am: prom/alertmanager:v0.35.0
            grafana: grafana/grafana:13.3.1
          - loki: grafana/loki:3.4.6
            am: prom/alertmanager:v0.28.1
            grafana: grafana/grafana:12.4.15
          - loki: grafana/loki:2.9.17
            am: prom/alertmanager:v0.27.0
            grafana: ""
          - loki: grafana/loki:latest
            am: prom/alertmanager:latest
            grafana: grafana/grafana:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: pull images
        run: |
          for i in ${{ matrix.loki }} ${{ matrix.am }} ${{ matrix.grafana }}; do docker pull -q "$i"; done
      - name: e2e
        env:
          LAL_E2E: "1"
          LOKI_IMAGE: ${{ matrix.loki }}
          AM_IMAGE: ${{ matrix.am }}
          GRAFANA_IMAGE: ${{ matrix.grafana }}
        run: go test -v -count=1 -timeout 15m ./e2e/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loki-alert-lines:ci .
      - run: docker run --rm loki-alert-lines:ci version
